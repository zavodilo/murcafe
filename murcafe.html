
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мур-кафе: один обычный день</title>
<meta name="description" content="Уютная игра-симулятор котокафе: готовь напитки, успевая за гостями. Один HTML-файл на движке PlayCanvas.">
<style>
  :root{
    --cream:#fff6e8; --wood:#a9713f; --wood-d:#8f5a30; --brown:#5b4230; --ink:#3c2c22;
    --sage:#9db88a; --sage-d:#6f8f63; --pink:#e8a7a0; --pink-d:#d9837c; --gold:#f2c14e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#241a12}
  body{font-family:"Comic Sans MS","Comic Sans","Segoe UI Rounded","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(1200px 700px at 50% 40%, #35251a 0%, #241a12 70%)}
  #stage{position:relative;box-shadow:0 20px 60px rgba(0,0,0,.55);border-radius:6px;overflow:hidden}
  #game{display:block;background:#1d1510;border-radius:6px}
  #stage.shake{animation:shk .4s}
  @keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,3px)}}
  #vignette{position:absolute;inset:0;pointer-events:none;transition:background 2.5s;mix-blend-mode:multiply}
  .hidden{display:none !important}
  /* Prevent the main menu from flashing during the initial PlayCanvas boot. */
  #stage.booting #screen-menu{visibility:hidden;opacity:0;pointer-events:none}

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;pointer-events:none;font-weight:700;color:var(--cream);
    text-shadow:0 2px 0 rgba(60,44,34,.65);font-size:17px}
  #hud .grp{display:flex;align-items:center;gap:14px}
  #hud-clock{background:rgba(60,44,34,.55);border:2px solid rgba(255,246,232,.35);border-radius:12px;padding:2px 10px;font-size:15px}
  #hud-streak{color:var(--gold);font-size:16px;min-width:90px;text-align:center}
  .coin-ic{display:inline-block;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,var(--gold) 60%,#c98d2a);border:2px solid #a8781f;vertical-align:-3px}
  #hud-hearts i{display:inline-block;width:21px;height:19px;margin-left:4px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 22'><path d='M12 21C4 14 1 9 3.5 5.5C6 2 10 3 12 6C14 3 18 2 20.5 5.5C23 9 20 14 12 21Z' fill='%23e8788a' stroke='%23fff6e8' stroke-width='2'/></svg>") center/contain no-repeat;
    transition:opacity .3s, filter .3s}
  #hud-hearts i.off{opacity:.22;filter:grayscale(1)}
  .hud-mini{font-size:13px;opacity:.9}
  .ok{color:#bfe6b0}.bad{color:#f0b0a8}

  /* ---------- screens ---------- */
  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,32,24,.5);backdrop-filter:blur(2px);z-index:20}
  .panel{background:var(--cream);border:4px solid var(--wood-d);border-radius:22px;box-shadow:0 14px 0 rgba(60,44,34,.35),0 24px 60px rgba(0,0,0,.4);
    padding:26px 34px;max-width:640px;width:min(92%,640px);text-align:center;max-height:92%;overflow:auto}
  .panel h1{margin:0 0 4px;font-size:44px;color:var(--sage-d);letter-spacing:1px;text-shadow:0 3px 0 rgba(255,255,255,.7)}
  .panel h2{margin:0 0 12px;font-size:28px;color:var(--wood-d)}
  .tagline{margin:0 0 18px;color:#8a6a4f;font-size:15px}
  .btn{display:block;width:100%;margin:9px 0;padding:11px 18px;font:inherit;font-weight:700;font-size:17px;color:var(--ink);
    background:linear-gradient(#fffdf6,#f4e3c8);border:3px solid var(--wood-d);border-radius:14px;cursor:pointer;
    box-shadow:0 4px 0 var(--wood-d);transition:transform .08s, box-shadow .08s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--wood-d)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--wood-d)}
  .btn.primary{background:linear-gradient(#b6d0a4,var(--sage));border-color:var(--sage-d);box-shadow:0 4px 0 var(--sage-d)}
  .btn.pinky{background:linear-gradient(#f6cfca,var(--pink));border-color:var(--pink-d);box-shadow:0 4px 0 var(--pink-d)}
  .btn.row{display:inline-block;width:auto;margin:6px}
  .menu-stats{margin-top:10px;font-size:14px;color:#8a6a4f;min-height:18px}
  .paw{font-size:26px}
  .how-p{ text-align:left;font-size:15px;line-height:1.45;margin:8px 0;padding-left:30px;position:relative}
  .how-p:before{content:"🐾";position:absolute;left:2px;top:0;font-size:15px}
  #recbook{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:12px 0 6px;text-align:left}
  .rec{display:flex;align-items:center;gap:8px;font-size:14px;border-bottom:2px dotted #d9c4a6;padding:4px 2px}
  .rec img{height:34px;image-rendering:auto}
  .rec-name{flex:1}
  .rec-price{color:var(--wood-d);font-weight:700;white-space:nowrap}
  .rec.locked{opacity:.4;filter:grayscale(.6)}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:12px 0;font-size:16px}
  .setrow input[type=range]{flex:1;accent-color:var(--sage-d)}
  select{font:inherit;font-size:15px;padding:4px 8px;border:2px solid var(--wood-d);border-radius:10px;background:#fffdf6;color:var(--ink)}
  .res-row{display:flex;justify-content:space-between;font-size:16px;margin:7px 0;border-bottom:2px dotted #d9c4a6;padding-bottom:4px}
  .res-row b{color:var(--wood-d)}
  #res-stars{font-size:34px;color:var(--gold);letter-spacing:6px;text-shadow:0 2px 0 rgba(160,110,40,.4);margin:4px 0 10px}
  .go-text{font-size:15px;color:#8a6a4f;margin:6px 0 14px}
  .credit{margin-top:14px;font-size:12px;color:#a5876a}

  /* ---------- toasts / floaters / day intro ---------- */
  #toasts{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:15}
  .toast{background:rgba(255,246,232,.96);border:3px solid var(--wood-d);border-radius:14px;padding:8px 18px;font-size:15px;font-weight:700;color:var(--ink);
    box-shadow:0 4px 0 rgba(60,44,34,.3);animation:tin .35s ease-out;max-width:80%}
  .toast.out{opacity:0;transform:translateY(8px);transition:all .4s}
  @keyframes tin{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
  #floaters{position:absolute;inset:0;pointer-events:none;z-index:16;overflow:hidden}
  .floater{position:absolute;transform:translate(-50%,0);font-weight:700;font-size:20px;color:#2e7d4f;
    text-shadow:0 2px 0 #fff6e8,0 0 6px rgba(255,246,232,.8);animation:fup 1.25s ease-out forwards}
  .floater.perfect{color:var(--pink-d);font-size:16px}
  @keyframes fup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
  #dayintro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:18}
  #dayintro.show{animation:di 3s ease forwards}
  .di-title{font-size:56px;font-weight:700;color:var(--cream);text-shadow:0 4px 0 rgba(60,44,34,.6),0 0 30px rgba(255,220,150,.5)}
  .di-unlock{margin-top:8px;font-size:17px;color:#ffe9b0;text-shadow:0 2px 0 rgba(60,44,34,.7);background:rgba(60,44,34,.45);padding:6px 16px;border-radius:12px}
  @keyframes di{0%{opacity:0;transform:scale(.85)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
  #loadfail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--cream);font-size:18px;text-align:center;padding:30px;z-index:40}
  #hud-rush{background:rgba(216,131,124,.92);border:2px solid rgba(255,246,232,.55);border-radius:12px;padding:3px 9px;font-size:13px;color:#fff7ec;animation:rushPulse .8s infinite alternate}
  #hud-purr{background:rgba(111,143,99,.92);border:2px solid rgba(255,246,232,.45);border-radius:12px;padding:3px 9px;font-size:13px;color:#fff7ec;min-width:78px;text-align:center}
  @keyframes rushPulse{from{transform:scale(1)}to{transform:scale(1.04)}}
  .upgrade-coins{display:inline-block;margin:3px 0 10px;padding:6px 12px;border-radius:12px;background:#f4e3c8;color:var(--wood-d);font-weight:700}
  .upgrade-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 12px}
  .upgrade-card{background:linear-gradient(#fffdf6,#f6ead7);border:3px solid var(--wood-d);border-radius:18px;padding:14px 12px;text-align:left;box-shadow:0 5px 0 rgba(143,90,48,.2);cursor:pointer;transition:transform .08s,box-shadow .08s,border-color .08s;min-height:180px}
  .upgrade-card:hover{transform:translateY(-3px);box-shadow:0 8px 0 rgba(143,90,48,.2)}
  .upgrade-card.disabled{opacity:.46;filter:grayscale(.35);cursor:not-allowed;transform:none;box-shadow:0 4px 0 rgba(143,90,48,.12)}
  .upgrade-icon{font-size:36px;margin-bottom:6px}.upgrade-name{font-size:18px;font-weight:800;color:var(--sage-d);margin-bottom:4px}.upgrade-desc{font-size:13px;line-height:1.35;color:#7e624b;min-height:54px}.upgrade-cost{margin-top:9px;font-weight:800;color:var(--wood-d)}
  @media (max-width:700px){ .panel h1{font-size:32px} .panel{padding:18px 20px} #recbook{grid-template-columns:1fr} .upgrade-cards{grid-template-columns:1fr} .upgrade-card{min-height:auto} }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage" class="booting">
    <canvas id="game"></canvas>
    <div id="vignette"></div>

    <div id="hud" class="hidden">
      <div class="grp">
        <span id="hud-day"></span>
        <span id="hud-clock"></span>
      </div>
      <div class="grp"><span id="hud-streak"></span><span id="hud-rush" class="hidden"></span><span id="hud-purr"></span></div>
      <div class="grp">
        <span class="hud-mini ok">✓<span id="hud-served">0</span></span>
        <span class="hud-mini bad">✗<span id="hud-lost">0</span></span>
        <span><span class="coin-ic"></span> <span id="hud-coins">0</span></span>
        <span id="hud-hearts"><i></i><i></i><i></i></span>
      </div>
    </div>

    <div id="toasts"></div>
    <div id="floaters"></div>
    <div id="dayintro"></div>

    <!-- MAIN MENU -->
    <div class="screen" id="screen-menu">
      <div class="panel">
        <div class="paw">🐾</div>
        <h1 data-i18n="title1"></h1>
        <h2 data-i18n="title2"></h2>
        <p class="tagline" data-i18n="tagline"></p>
        <button class="btn primary" id="btn-start" data-i18n="btn_start"></button>
        <button class="btn" id="btn-continue" data-i18n="btn_continue"></button>
        <button class="btn" id="btn-how" data-i18n="btn_how"></button>
        <button class="btn" id="btn-set" data-i18n="btn_settings"></button>
        <button class="btn" id="btn-about" data-i18n="btn_about"></button>
        <div class="menu-stats" id="menu-stats"></div>
      </div>
    </div>

    <!-- HOW TO PLAY -->
    <div class="screen hidden" id="screen-how">
      <div class="panel">
        <h2 data-i18n="menu_title"></h2>
        <div class="how-p" data-i18n="how1"></div>
        <div class="how-p" data-i18n="how2"></div>
        <div class="how-p" data-i18n="how3"></div>
        <div class="how-p" data-i18n="how4"></div>
        <div class="how-p" data-i18n="how5"></div>
        <h2 style="font-size:20px;margin-top:16px" data-i18n="how_recipes"></h2>
        <div id="recbook"></div>
        <button class="btn row" id="btn-how-back" data-i18n="btn_back"></button>
        <button class="btn row pinky" id="btn-pause-how" style="display:none"></button>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="screen hidden" id="screen-set">
      <div class="panel" style="max-width:440px">
        <h2 data-i18n="btn_settings"></h2>
        <div class="setrow"><span data-i18n="set_music"></span><input type="range" id="set-music" min="0" max="100"></div>
        <div class="setrow"><span data-i18n="set_sfx"></span><input type="range" id="set-sfx" min="0" max="100"></div>
        <div class="setrow"><span data-i18n="set_lang"></span>
          <select id="set-lang"><option value="ru">Русский</option><option value="en">English</option></select>
        </div>
        <button class="btn" id="btn-full" data-i18n="btn_fullscreen"></button>
        <button class="btn row" id="btn-set-back" data-i18n="btn_back"></button>
      </div>
    </div>

    <!-- PAUSE -->
    <div class="screen hidden" id="screen-pause">
      <div class="panel" style="max-width:420px">
        <h2 data-i18n="pause_title"></h2>
        <button class="btn primary" id="btn-resume" data-i18n="btn_resume"></button>
        <button class="btn" id="btn-how2" data-i18n="btn_how"></button>
        <button class="btn" id="btn-pause-set" data-i18n="btn_settings"></button>
        <button class="btn pinky" id="btn-restart" data-i18n="btn_restart"></button>
        <button class="btn" id="btn-pause-menu" data-i18n="btn_menu"></button>
      </div>
    </div>

    <!-- DAY RESULTS -->
    <div class="screen hidden" id="screen-results">
      <div class="panel" style="max-width:460px">
        <h2 id="res-title"></h2>
        <div id="res-stars"></div>
        <div class="res-row"><span data-i18n="res_served"></span><b id="res-served"></b></div>
        <div class="res-row"><span data-i18n="res_lost"></span><b id="res-lost"></b></div>
        <div class="res-row"><span data-i18n="res_coins"></span><b id="res-coins"></b></div>
        <div class="res-row"><span data-i18n="res_best"></span><b id="res-best"></b></div>
        <div class="res-row" id="res-bonus" style="display:none;color:var(--sage-d);font-weight:700"></div>
        <button class="btn primary" id="btn-next" data-i18n="res_next"></button>
      </div>
    </div>

    <!-- UPGRADES -->
    <div class="screen hidden" id="screen-upgrade">
      <div class="panel" style="max-width:760px">
        <div class="paw">🐾</div>
        <h2 data-i18n="upgrade_title"></h2>
        <p class="tagline" data-i18n="upgrade_text"></p>
        <div id="upgrade-coins" class="upgrade-coins"></div>
        <div id="upgrade-cards" class="upgrade-cards"></div>
        <button class="btn row" id="btn-skip-upgrade" data-i18n="upgrade_skip"></button>
      </div>
    </div>

    <!-- GAME OVER -->
    <div class="screen hidden" id="screen-gameover">
      <div class="panel" style="max-width:460px">
        <h2 data-i18n="go_title"></h2>
        <p class="go-text" data-i18n="go_text"></p>
        <div class="res-row"><span id="go-days"></span></div>
        <div class="res-row"><span id="go-served"></span></div>
        <div class="res-row"><span id="go-best"></span></div>
        <div class="res-row"><span id="go-tips"></span></div>
        <button class="btn primary" id="btn-go-retry" data-i18n="btn_restart"></button>
        <button class="btn" id="btn-go-menu" data-i18n="btn_menu"></button>
      </div>
    </div>

    <!-- ABOUT -->
    <div class="screen hidden" id="screen-about">
      <div class="panel" style="max-width:520px">
        <h2 data-i18n="btn_about"></h2>
        <p class="go-text" data-i18n="about_text"></p>
        <button class="btn row" id="btn-about-back" data-i18n="btn_back"></button>
      </div>
    </div>

    <div id="loadfail" class="hidden">Не удалось загрузить движок PlayCanvas / Failed to load the PlayCanvas engine.<br>Проверь соединение с интернетом и обнови страницу / Check your connection and reload.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/playcanvas@2.22.2/build/playcanvas.min.js"></script>
<script>
/* ============================================================
   PURR CAFE — core: utils, i18n, storage, procedural audio
   ============================================================ */
'use strict';

/* ---------- tiny utils ---------- */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };

/* ---------- i18n ---------- */
const LANGS = ['ru', 'en'];
const I18N = {
  ru: {

    btn_back: 'Назад', btn_resume: 'Вернуться в игру', btn_restart: 'Начать заново', btn_menu: 'В главное меню', btn_next: 'Дальше',
    btn_close: 'Закрыть', btn_fullscreen: 'Во весь экран', btn_book: 'Книга рецептов',
    hud_day: 'День {d}', hud_served: 'обслужено', hud_lost: 'упущено',
    clock_open: 'открыто', clock_closed: 'закрытие',
    menu_title: 'Как играть',

    how3: 'Когда напиток совпал с заказом — кликни по гостю, чтобы подать. Еду бери из витрины: она ложится на поднос рядом с напитком.',
    how4: 'У каждого гостя есть терпение. Если оно кончится — гость уйдёт сердитым, а ты потеряешь сердечко. Три сердечка — и кафе закроется.',

    how_recipes: 'Книга рецептов', how_price: 'цена',
    set_music: 'Музыка', set_sfx: 'Звуки', set_lang: 'Язык',
    res_title: 'День {d} окончен!', res_served: 'Обслужено гостей', res_lost: 'Ушло сердитыми', res_coins: 'Монеты за день', res_best: 'Лучшая серия',
    res_stars: 'Уют дня', res_next: 'Открыть кафе утром', res_bonus: 'Бонус за уютный день без потерь: +{n}',
    go_title: 'Кафе закрывается…', go_text: 'Слишком много сердитых гостей. Но завтра будет новый день — и новая попытка.',

    pause_title: 'Пауза',
    toast_cup: 'Кликни по станции «Чашки» — без чашки напиток не сделать.',
    toast_ing: 'Теперь кликай ингредиенты из пузыря слева направо.',
    toast_serve: 'Напиток готов! Кликни по гостю с таким же заказом.',
    toast_free: 'Отлично! Держи кафе открытым до закрытия смены. Удачи!',
    toast_cat: 'Кликни по коту — мурчание вернёт гостям терпение.',
    toast_night: 'Ночь… странные гости платят вдвое, но заказы у них мудрёные.',
    toast_food: 'Открылась витрина с выпечкой! Еда подаётся вместе с напитком.',
    toast_wrong: 'Это не тот рецепт — вылей в корзину и начни заново.',
    toast_needcup: 'Сначала возьми чашку!',

    if (mix.includes('ice')) { g.fillStyle = 'rgba(255,255,255,.9)'; rr(g, x - 8, 18, 10, 10, 2); fill(g, 'rgba(255,255,255,.9)'); stroke(g, 2); rr(g, x + 1, 14, 10, 10, 2); fill(g, 'rgba(255,255,255,.9)'); stroke(g, 2); }
    if (!mix.includes('ice') && layers.length) { // steam
      g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(x - 6, 14); g.quadraticCurveTo(x - 10, 8, x - 6, 2); g.moveTo(x + 6, 14); g.quadraticCurveTo(x + 10, 8, x + 6, 2); g.stroke();
    }
  }
  if (food) {
    g.fillStyle = '#d9a86c'; ell(g, 88, 46, 16, 12); fill(g, '#d9a86c'); stroke(g, 2.5);
    g.fillStyle = '#5b4230'; [[-6, -3], [4, -5], [0, 4], [8, 2]].forEach(([dx, dy]) => { ell(g, 88 + dx, 46 + dy, 2.6, 2.6); fill(g, '#5b4230'); });
    g.fillStyle = '#fff6e8'; ell(g, 88, 56, 20, 5); fill(g, 'rgba(255,246,232,.9)');
  }
  return c;
}

/* ============================================================
   PURR CAFE — PlayCanvas scene layer: sprites, input, particles
   ============================================================ */
'use strict';

const Scene = {
  app: null, cam: null, texCache: new Map(), sprites: [], zones: [], particles: [],
  W: 1280, H: 720, ready: false, updateCbs: [], hoverCb: null,
  // subtle layered parallax: foreground reacts more than the room behind it
  parallaxX: 0, parallaxY: 0, parallaxTargetX: 0, parallaxTargetY: 0,
  parallaxMaxX: 16, parallaxMaxY: 9, parallaxReturnDelay: 1.2, parallaxIdle: 0,

  setParallaxFromPointer(x, cy) {
    const nx = clamp((x - this.W * 0.5) / (this.W * 0.5), -1, 1);
    const ny = clamp((cy - this.H * 0.5) / (this.H * 0.5), -1, 1);
    this.parallaxTargetX = nx * this.parallaxMaxX;
    this.parallaxTargetY = ny * this.parallaxMaxY;
    this.parallaxIdle = 0;
  },

  depthFactor(z) {
    if (z <= 0) return 0.16;
    if (z <= 5) return 0.28;
    if (z <= 10) return 0.42;
    if (z <= 20) return 0.58;
    if (z <= 32) return 0.76;
    return 0.92;
  },

  updateParallax(dt) {
    this.parallaxIdle += dt;
    if (this.parallaxIdle > this.parallaxReturnDelay) {
      this.parallaxTargetX *= Math.pow(0.06, dt);
      this.parallaxTargetY *= Math.pow(0.06, dt);
      if (Math.abs(this.parallaxTargetX) < 0.02) this.parallaxTargetX = 0;
      if (Math.abs(this.parallaxTargetY) < 0.02) this.parallaxTargetY = 0;
    }
    const k = 1 - Math.pow(0.0008, dt);
    this.parallaxX += (this.parallaxTargetX - this.parallaxX) * k;
    this.parallaxY += (this.parallaxTargetY - this.parallaxY) * k;
    for (const sp of this.sprites) sp.applyParallax?.();
  },

  async init(canvas) {
    if (typeof pc === 'undefined') throw new Error('no playcanvas');
    const device = await pc.createGraphicsDevice(canvas, { antialias: true, alpha: false, powerPreference: 'high-performance' });
    const app = new pc.Application(canvas, { graphicsDevice: device });
    this.app = app;
    app.setCanvasFillMode(pc.FILLMODE_NONE);
    // camera
    const camEnt = new pc.Entity('cam');
    camEnt.addComponent('camera', {
      projection: pc.PROJECTION_ORTHOGRAPHIC, orthoHeight: 360,
      clearColor: new pc.Color(0.11, 0.09, 0.08), nearClip: 0.1, farClip: 2000
    });
    camEnt.setPosition(640, 360, 900);
    app.root.addChild(camEnt);
    this.cam = camEnt;
    this.resize();
    window.addEventListener('resize', () => this.resize());
    // input
    canvas.addEventListener('pointerdown', e => {
      const w = this.worldFromEvent(e);
      this.setParallaxFromPointer(w.x, 720 - w.y);
      Audio_.resume();
      for (const cb of this.pointerCbs) cb(w.x, w.y, e);
    });
    canvas.addEventListener('pointermove', e => {
      const w = this.worldFromEvent(e);
      this.setParallaxFromPointer(w.x, 720 - w.y);
      if (this.hoverCb) this.hoverCb(w.x, w.y);
    });
    canvas.addEventListener('pointerleave', () => { this.parallaxIdle = this.parallaxReturnDelay + 0.01; });
    this.pointerCbs = [];
    app.on('update', dt => {
      dt = Math.min(dt, 0.05);
      this.updateParallax(dt);
      for (const cb of this.updateCbs) cb(dt);
      this.updateParticles(dt);
    });
    app.start();
    this.ready = true;
  },

  resize() {
    const canvas = this.app.graphicsDevice.canvas;
    const ww = window.innerWidth, wh = window.innerHeight;
    const scale = Math.min(ww / this.W, wh / this.H);
    const cssW = Math.floor(this.W * scale), cssH = Math.floor(this.H * scale);
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const bw = Math.floor(cssW * dpr), bh = Math.floor(cssH * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      this.app.setCanvasResolution(pc.RESOLUTION_FIXED, bw, bh);
    }
    this.cssScale = scale; this.cssW = cssW; this.cssH = cssH;
    const wrap = document.getElementById('stage');
    if (wrap) { wrap.style.width = cssW + 'px'; wrap.style.height = cssH + 'px'; }
  },

  worldFromEvent(e) {
    const r = this.app.graphicsDevice.canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * this.W, y: (1 - (e.clientY - r.top) / r.height) * this.H };
  },
  screenFromWorld(x, y) {
    const r = this.app.graphicsDevice.canvas.getBoundingClientRect();
    return { x: r.left + x / this.W * r.width, y: r.top + (1 - y / this.H) * r.height };
  },

  tex(canvas) {
    if (this.texCache.has(canvas)) return this.texCache.get(canvas);
    const t = new pc.Texture(this.app.graphicsDevice, {
      format: pc.PIXELFORMAT_RGBA8, width: canvas.width, height: canvas.height,
      minFilter: pc.FILTER_LINEAR, magFilter: pc.FILTER_LINEAR,
      addressU: pc.ADDRESS_CLAMP_TO_EDGE, addressV: pc.ADDRESS_CLAMP_TO_EDGE
    });
    t.setSource(canvas);
    this.texCache.set(canvas, t);
    return t;
  },

  mat(canvas) {
    const m = new pc.StandardMaterial();
    m.emissiveMap = this.tex(canvas);
    m.opacityMap = this.tex(canvas);
    m.opacityMapChannel = 'a';
    m.emissive = new pc.Color(1, 1, 1);
    m.useLighting = false;
    m.blendType = pc.BLEND_NORMAL;
    m.depthWrite = false;
    m.cull = pc.CULLFACE_NONE;
    m.update();
    return m;
  },

  /* sprite wrapper */
  sp(canvas, x, y, w, h, z) {
    const e = new pc.Entity();
    e.addComponent('render', { type: 'plane' });
    const mi = e.render.meshInstances[0];
    mi.material = this.mat(canvas);
    e.setEulerAngles(90, 0, 0);
    e.setPosition(x, y, z);
    e.setLocalScale(w, 1, h);
    this.app.root.addChild(e);
    const sp = {
      ent: e, mi, w, h, z, canvas,
      baseX: x, baseY: y,
      factor: Scene.depthFactor(z),
      get x() { return this.baseX; }, get y() { return this.baseY; },
      setPos(x, y) { this.baseX = x; this.baseY = y; this.applyParallax(); },
      setPosCY(x, cy) { this.baseX = x; this.baseY = 720 - cy; this.applyParallax(); },
      applyParallax() {
        const ox = Scene.parallaxX * this.factor;
        const oy = Scene.parallaxY * this.factor;
        e.setPosition(this.baseX + ox, this.baseY - oy, z);
      },
      setScale(sx, sy) { e.setLocalScale(this.w * sx, 1, this.h * sy); },
      setOpacity(o) { const m = mi.material; if (m.opacity !== o) { m.opacity = o; m.update(); } },
      setTint(r, g, b) { const m = mi.material; m.emissive = new pc.Color(r, g, b); m.update(); },
      setCanvas(c) { if (this.canvas === c) return; this.canvas = c; mi.material.emissiveMap = Scene.tex(c); mi.material.update(); },
      show(v) { e.enabled = v; },
      rot(a) { e.setEulerAngles(90, 0, a); },
      destroy() { const i = Scene.sprites.indexOf(this); if (i >= 0) Scene.sprites.splice(i, 1); e.destroy(); }
    };
    sp.applyParallax();
    this.sprites.push(sp);
    return sp;
  },

  /* particles */
  spawnParticle(kind, x, y, opt = {}) {
    const canvas = ART.c['p_' + kind]; if (!canvas) return;
    const s = this.sp(canvas, x, 720 - y, opt.size || 40, opt.size || 40, opt.z || 45);
    const p = {
      sp: s, vx: opt.vx !== undefined ? opt.vx : rnd(-20, 20), vy: opt.vy !== undefined ? opt.vy : rnd(60, 110),
      life: 0, max: opt.life || 1.0, grav: opt.grav !== undefined ? opt.grav : -60, rot: opt.rot || 0, vr: opt.vr || 0
    };
    this.particles.push(p);
    return p;
  },
  burst(kind, x, y, n = 6, spread = 90) {
    for (let i = 0; i < n; i++) {
      this.spawnParticle(kind, x + rnd(-14, 14), y + rnd(-10, 10), { vx: rnd(-spread, spread), vy: rnd(40, 140), life: rnd(0.6, 1.1), size: rnd(24, 44), vr: rnd(-3, 3) });
    }
  },
  updateParticles(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life += dt;
      const t = p.life / p.max;
      if (t >= 1) { p.sp.destroy(); this.particles.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      const pos = p.sp.ent.getPosition();
      p.sp.setPos(pos.x + p.vx * dt, pos.y + p.vy * dt);
      if (p.vr) p.sp.rot(p.vr * p.life * 57.3 % 360);
      p.sp.setOpacity(t < 0.15 ? t / 0.15 : 1 - Math.max(0, (t - 0.6) / 0.4));
      const sc = 0.7 + easeOut(Math.min(1, t * 3)) * 0.4;
      p.sp.setScale(sc, sc);
    }
  }
};

'use strict';

  { id: 'mocha', steps: ['cup', 'coffee', 'milk', 'syrup'], price: 8, day: 3 },
  { id: 'matcha', steps: ['cup', 'matcha', 'milk'], price: 8, day: 4 },
  { id: 'moon', steps: ['cup', 'tea', 'ice', 'syrup'], price: 10, day: 4, night: true },
  { id: 'ghost', steps: ['cup', 'milk', 'matcha', 'syrup'], price: 12, day: 5, night: true },

const FOOD = { id: 'cookie', price: 3, day: 3 };
const STATIONS = [
  { id: 'cups', x: 210, day: 1 }, { id: 'tea', x: 340, day: 1 }, { id: 'coffee', x: 470, day: 1 },
  { id: 'milk', x: 600, day: 1 }, { id: 'ice', x: 730, day: 2 }, { id: 'syrup', x: 860, day: 3 },
  { id: 'matcha', x: 990, day: 4 }, { id: 'pastry', x: 1120, day: 3 }, { id: 'trash', x: 1225, day: 1 },

const SEATS = [300, 480, 660, 840, 1020];
const CUST_DAYS = { calico: 1, grey: 1, black: 1, orange: 2, duck: 2, raccoon: 3, ghost: 4, being: 6 };
/* vertical layout in canvas coords (top-down) */
const LY = { station: 302, barista: 365, tray: 295, seatFeet: 640, bubble: 455, cat: 664 };

function dayCfg(n) {
  return {
    duration: 95 + Math.min(45, (n - 1) * 6),
    spawnBase: Math.max(5.5, 15 - n * 1.3),
    patience: Math.max(16, 34 - n * 2),
    seats: n < 3 ? 4 : 5,
    nightFrac: 0.7,
    rushStart: 0.46,
    rushEnd: 0.67
  };
}

const UPGRADES = [
  { id:'soft', icon:'🛋️', name:'up_soft', desc:'up_soft_desc', cost:45 },
  { id:'fast', icon:'🏃', name:'up_fast', desc:'up_fast_desc', cost:50 },
  { id:'cat', icon:'🐾', name:'up_cat', desc:'up_cat_desc', cost:55 },
  { id:'tip', icon:'🪙', name:'up_tip', desc:'up_tip_desc', cost:60 },
];

const Game = {
  state: 'boot',           // menu | play | pause | results | gameover
  day: 1, t: 0, cfg: null,
  coins: 0, coinsDay: 0, servedDay: 0, lostDay: 0,
  strikes: 0, streak: 0, bestStreak: 0,
  customers: [], cats: [], spawnT: 4, phase: 0, night: false,
  barista: null, overT: -1, endT: -1,
  rush: false, rushAnnounced: false,
  purr: 72, purrMax: 100,
  upgrades: {}, pendingUpgradeChoices: [],
  tut: {}, tutDone: {},
  bg: {}, stationSpr: {}, glowSpr: [],

  /* ---------- scene setup ---------- */
  buildScene() {
    this.bg.day = Scene.sp(ART.c.bg_day, 640, 360, 1280, 720, 0);
    this.bg.dusk = Scene.sp(ART.c.bg_dusk, 640, 360, 1280, 720, 0.5);
    this.bg.night = Scene.sp(ART.c.bg_night, 640, 360, 1280, 720, 1);
    this.bg.day.setScale(1.04, 1.04);
    this.bg.dusk.setScale(1.04, 1.04);
    this.bg.night.setScale(1.04, 1.04);
    this.bg.dusk.setOpacity(0); this.bg.night.setOpacity(0);
    for (const st of STATIONS) {
      const cnv = ART.c['st_' + st.id];
      const h = cnv.height, w = cnv.width;
      const s = Scene.sp(cnv, st.x, 720 - (LY.station + (96 - h) / 2), w, h, 5);
      this.stationSpr[st.id] = s;
      if (st.day > 1) s.setOpacity(0.25);
    }
    this.glowSpr = [250, 1010].map(x => { const g = Scene.sp(ART.c.glow, x, 720 - 120, 240, 240, 46); g.setOpacity(0); return g; });
    this.barista = {
      x: 640, tx: 640, state: 'idle', actT: 0, pending: null, queue: [], frame: 0, bobT: 0,
      mix: [], food: false, wrong: false,
      spr: Scene.sp(ART.c.barista_0, 640, 720 - LY.barista, 110, 160, 10),
      tray: Scene.sp(ART.c.tray_empty, 640, 720 - LY.tray, 120, 64, 12),
    };
    this.updateTray();
    this.cats = [
      { x: 390, y: 668, tx: 390, ty: 668, style: 'ginger', state: 'idle', t: 2, cd: 0, spr: Scene.sp(ART.c.cat_ginger_0, 390, 720 - 668, 132, 88, 18), frame: 0, ft: 0 },
      { x: 900, y: 690, tx: 900, ty: 690, style: 'grey', state: 'idle', t: 5, cd: 0, spr: Scene.sp(ART.c.cat_grey_0, 900, 720 - 690, 132, 88, 18), frame: 0, ft: 0 },
    ];
    Scene.pointerCbs.push((x, wy) => this.onPointer(x, 720 - wy));
    Scene.hoverCb = (x, wy) => {
      const c = Scene.app.graphicsDevice.canvas;
      c.style.cursor = this.hitAny(x, 720 - wy) ? 'pointer' : 'default';
    };
  },

  /* ---------- day flow ---------- */
  newRun() { this.coins = 0; this.upgrades = {}; Store.data.run = { day: 1, coins: 0, upgrades: {} }; Store.save(); this.startDay(1); },
  continueRun() { const r = Store.data.run; if (r) { this.coins = r.coins || 0; this.upgrades = Object.assign({}, r.upgrades || {}); this.startDay(r.day); } else this.newRun(); },

  startDay(n) {
    this.day = n; this.cfg = dayCfg(n);
    this.t = 0; this.coinsDay = 0; this.servedDay = 0; this.lostDay = 0;
    this.strikes = 0; this.streak = 0; this.bestStreak = 0;
    this.spawnT = 3.5; this.night = false; this.phase = 0; this.overT = -1; this.endT = -1;
    this.rush = false; this.rushAnnounced = false;
    this.purrMax = 100 + (this.upgrades.cat ? 25 : 0); this.purr = Math.min(this.purrMax, 72 + (this.upgrades.cat ? 8 : 0));
    for (const c of this.customers) this.destroyCustomer(c);
    this.customers = [];
    const b = this.barista;
    b.mix = []; b.food = false; b.wrong = false; b.pending = null; b.queue = []; b.state = 'idle'; b.tx = 640;
    this.updateTray();
    if (n === 1) this.tut = {}; else this.tut = { cup: 1, ing: 1, serve: 1, free: 1 };
    this.tutDone = {};
    Store.data.run = { day: n, coins: this.coins, upgrades: this.upgrades }; Store.save();
    this.state = 'play';
    Audio_.night = false;
    UI.showDayIntro(n, this.unlocksFor(n));
    UI.syncHud(true);
  },

  unlocksFor(n) {
    const out = [];
    STATIONS.forEach(s => { if (s.day === n && s.id !== 'cups' && s.id !== 'trash') out.push(t('st_' + s.id)); });
    RECIPES.forEach(r => { if (r.day === n) out.push(t('r_' + r.id)); });
    Object.keys(CUST_DAYS).forEach(k => { if (CUST_DAYS[k] === n) out.push(k === 'duck' ? (LANG === 'ru' ? 'утки' : 'ducks') : (LANG === 'ru' ? 'новые гости' : 'new guests')); });
    return out;
  },

  endDay() {
    if (this.lostDay === 0) { this.coinsDay += 50; this.coins += 50; }
    Store.data.best.served += this.servedDay;
    if (this.day > (Store.data.best.day || 0)) Store.data.best.day = this.day;
    if (this.coins > (Store.data.best.tips || 0)) Store.data.best.tips = this.coins;
    Store.data.run = { day: this.day + 1, coins: this.coins, upgrades: this.upgrades }; Store.save();
    this.state = 'results';
    Audio_.play('star');
    UI.showResults();
  },

  gameOver() {
    this.state = 'gameover';
    Store.data.run = null;
    if (this.day > (Store.data.best.day || 0)) Store.data.best.day = this.day;
    Store.save();
    Audio_.play('fail');
    Audio_.stopMusic();
    UI.showGameOver();
  },

  /* ---------- spawning ---------- */
  freeSeat() {
    const used = new Set(this.customers.filter(c => c.state !== 'leave').map(c => c.seat));
    for (let i = 0; i < this.cfg.seats; i++) if (!used.has(i)) return i;
    return -1;
  },
  spawnCustomer() {
    const seat = this.freeSeat(); if (seat < 0) return;
    const night = this.night;
    let pool = Object.keys(CUST_DAYS).filter(k => CUST_DAYS[k] <= this.day && (!CUST_TYPES[k].ghost || night));
    const type = pick(pool);
    const isGhost = !!CUST_TYPES[type].ghost;
    let rpool = RECIPES.filter(r => r.day <= this.day && (!r.night || night));
    if (night) { const nr = rpool.filter(r => r.night); if (nr.length && Math.random() < 0.55) rpool = nr; }
    const recipe = pick(rpool);
    const food = this.day >= FOOD.day && Math.random() < 0.32;
    const T = CUST_TYPES[type];
    const patienceMult = this.upgrades.soft ? 1.12 : 1;
    const patMax = this.cfg.patience * T.patience * (0.85 + recipe.steps.length * 0.13) * patienceMult + (food ? 6 : 0);
    const c = {
      type, seat, state: 'enter', x: -70, y: LY.seatFeet, tx: SEATS[seat], ty: LY.seatFeet,
      order: { recipe, food }, pat: patMax, patMax, bobT: rnd(0, 6), ft: 0, frame: 0, shakeT: 0,
      spr: Scene.sp(ART.c['cust_' + type + '_0'], -70, 720 - (LY.seatFeet - 75), 120, 150, 20),
      bubble: null, icons: [], iconXs: [], barBack: null, bar: null, fade: isGhost ? 0 : 1, happy: null
    };
    this.customers.push(c);
    Audio_.play(isGhost ? 'ghost' : (T.quack ? 'quack' : 'chime'));
    if (isGhost) c.spr.setOpacity(0);
  },

  makeBubble(c) {
    const steps = c.order.recipe.steps;
    const bw = 30 + steps.length * 34;
    const by = c.y - 185;
    c.bubble = Scene.sp(ART.c['bubble' + clamp(steps.length, 2, 4)], c.x, 720 - by, bw, 74, 30);
    c.bubble.setScale(0.1, 0.1);
    c.iconXs = steps.map((s, i) => c.x - (steps.length * 34) / 2 + 17 + i * 34);
    c.icons = steps.map((s, i) => {
      const ic = Scene.sp(ART.c['icon_' + s], c.iconXs[i], 720 - (by - 6), 34, 34, 31);
      ic.setOpacity(0);
      return ic;
    });
    if (c.order.food) {
      c.iconXs.push(c.x + (steps.length * 34) / 2 - 12);
      const ic = Scene.sp(ART.c.icon_cookie, c.iconXs[c.iconXs.length - 1], 720 - (by - 6), 34, 34, 31);
      ic.setOpacity(0); c.icons.push(ic);
    }
    c.barBack = Scene.sp(ART.c.barback, c.x, 720 - (by + 20), bw - 26, 10, 31);
    c.bar = Scene.sp(ART.c.bar, c.x, 720 - (by + 20), bw - 26, 10, 32);
    c.popT = 0;
  },
  destroyCustomer(c) {
    c.spr.destroy();
    if (c.bubble) { c.bubble.destroy(); c.icons.forEach(i => i.destroy()); c.barBack.destroy(); c.bar.destroy(); }
  },

  /* ---------- pointer ---------- */
  hitAny(x, cy) {
    if (this.state !== 'play') return false;
    return !!(this.hitCustomer(x, cy) || this.hitCat(x, cy) || this.hitStation(x, cy));
  },
  hitCustomer(x, cy) {
    const f = Scene.depthFactor(20);
    x -= Scene.parallaxX * f; cy -= Scene.parallaxY * f;
    for (const c of this.customers) if (c.state === 'wait' && Math.abs(x - c.x) < 62 && cy > 460 && cy < 650) return c;
    return null;
  },
  hitCat(x, cy) {
    const f = Scene.depthFactor(18);
    x -= Scene.parallaxX * f; cy -= Scene.parallaxY * f;
    for (const k of this.cats) if (Math.abs(x - k.x) < 62 && Math.abs(cy - k.y) < 46) return k;
    return null;
  },
  hitStation(x, cy) {
    const f = Scene.depthFactor(5);
    x -= Scene.parallaxX * f; cy -= Scene.parallaxY * f;
    for (const st of STATIONS) {
      const s = this.stationSpr[st.id];
      if (Math.abs(x - st.x) < s.w / 2 + 10 && cy > LY.station - s.h / 2 - 16 && cy < LY.station + s.h / 2 + 12) return st;
    }
    return null;
  },
  onPointer(x, cy) {
    if (this.state !== 'play') return;
    const c = this.hitCustomer(x, cy);
    if (c) { this.pushQ({ type: 'serve', cust: c }); Audio_.play('click'); return; }
    const k = this.hitCat(x, cy);
    if (k) { this.petCat(k); return; }
    const st = this.hitStation(x, cy);
    if (st) {
      if (st.day > this.day) { Audio_.play('err'); UI.toast(t('toast_locked')); return; }
      this.pushQ({ type: 'station', st: st.id });
      Audio_.play('click');
      return;
    }
  },
  pushQ(item) { const q = this.barista.queue; q.push(item); if (q.length > 8) q.shift(); },

  petCat(k) {
    const cooldown = this.upgrades.cat ? 3.5 : 5;
    if (k.cd > 0 || k.state === 'pet' || this.purr < 35) {
      if (this.purr < 35) UI.toast(LANG === 'ru' ? 'Нужно ещё мурчание — заработай его идеальными заказами.' : 'You need more purr — earn it with great orders.');
      return;
    }
    k.state = 'pet'; k.t = 1.1; k.cd = cooldown;
    this.purr -= 35;
    Audio_.play('purr'); setTimeout(() => Audio_.play('meow'), 150);
    Scene.burst('heart', k.x, k.y + 20, 5, 60);
    let urgent = null;
    for (const c of this.customers) if (c.state === 'wait' && (!urgent || c.pat < urgent.pat)) urgent = c;
    for (const c of this.customers) if (c.state === 'wait') {
      const boost = c === urgent ? 0.24 : 0.08;
      c.pat = Math.min(c.patMax, c.pat + c.patMax * boost);
      Scene.spawnParticle('heart', c.x + rnd(-20, 20), c.y - 90, { vy: 70, life: 0.9, size: c === urgent ? 32 : 22 });
    }
    UI.floater(k.x, k.y - 42, 'мур-р-р!', 'perfect');
    this.tutDone.cat = 1; UI.syncHud(true);
  },

  /* ---------- barista actions ---------- */
  applyStation(id) {
    const b = this.barista;
    const sfx = { cups: 'cup', tea: 'pour', coffee: 'pour', milk: 'pour', syrup: 'pour', matcha: 'steam', ice: 'ice', pastry: 'pop', trash: 'trash' };
    if (id === 'trash') {
      if (!b.mix.length && !b.food) { Audio_.play('err'); return; }
      b.mix = []; b.food = false; b.wrong = false; Audio_.play('trash'); this.updateTray(); return;
    }
    if (id === 'pastry') {
      if (this.day < FOOD.day) { Audio_.play('err'); UI.toast(t('toast_locked')); return; }
      if (b.food) { Audio_.play('err'); UI.toast(t('toast_trayfull')); return; }
      b.food = true; Audio_.play('pop'); this.updateTray(); return;
    }
    if (id === 'cups') {
      if (b.mix.length) { Audio_.play('err'); return; }
      b.mix = ['cup']; Audio_.play('cup'); this.updateTray(); return;
    }
    if (!b.mix.length) { Audio_.play('err'); UI.toast(t('toast_needcup')); return; }
    if (b.mix.includes(id)) { Audio_.play('err'); return; }
    b.mix.push(id); Audio_.play(sfx[id] || 'pour');
    b.wrong = !RECIPES.some(r => r.day <= this.day && r.steps.length >= b.mix.length && r.steps.slice(0, b.mix.length).every((s, i) => s === b.mix[i]));
    if (b.wrong) { UI.toast(t('toast_wrong')); Scene.spawnParticle('sweat', b.x + 30, 320, { vy: 40, life: 0.8, size: 30 }); }
    this.updateTray();
    if (this.day === 1 && b.mix.length === 2 && !this.tut.cup) { this.tut.cup = 1; UI.toast(t('toast_ing')); }
  },
  updateTray() {
    const b = this.barista;
    if (!b.mix.length && !b.food) b.tray.setCanvas(ART.c.tray_empty);
    else b.tray.setCanvas(traySprite(b.mix, b.food));
  },
  trayMatches(c) {
    const b = this.barista;
    return c.order.recipe.steps.length === b.mix.length &&
      c.order.recipe.steps.every((s, i) => s === b.mix[i]) && c.order.food === b.food;
  },
  tryServe(c) {
    const b = this.barista;
    const ok = c.order.recipe.steps.length === b.mix.length &&
      c.order.recipe.steps.every((s, i) => s === b.mix[i]) &&
      c.order.food === b.food;
    if (!ok) {
      c.pat = Math.max(0.5, c.pat - 5); c.shakeT = 0.5;
      Audio_.play('err');
      Scene.spawnParticle('sweat', c.x + 34, c.y - 120, { vy: 50, life: 0.8, size: 30 });
      if (b.wrong || (b.mix.length && !RECIPES.some(r => r.steps.join() === b.mix.join()))) UI.toast(t('toast_wrong'));
      return;
    }
    const T = CUST_TYPES[c.type];
    const patFrac = clamp(c.pat / c.patMax, 0, 1);
    this.streak++; this.bestStreak = Math.max(this.bestStreak, this.streak);
    const streakMult = 1 + Math.min(10, this.streak - 1) * 0.1;
    const price = c.order.recipe.price + (c.order.food ? FOOD.price : 0);
    const tipBoost = this.upgrades.tip ? 1.1 : 1;
    const tip = Math.round(price * 0.55 * patFrac * T.tip * streakMult * tipBoost);
    const gain = price + tip;
    this.coins += gain; this.coinsDay += gain; this.servedDay++;
    this.purr = clamp(this.purr + (patFrac > 0.66 ? 10 : 4), 0, this.purrMax);
    b.mix = []; b.food = false; b.wrong = false; this.updateTray();
    Audio_.play('ding'); setTimeout(() => Audio_.play('coin'), 120);
    Scene.burst('heart', c.x, c.y - 110, 4, 60);
    Scene.spawnParticle('coin', c.x + rnd(-10, 10), c.y - 130, { vy: 120, life: 1.0, size: 34 });
    UI.floater(c.x, c.y - 150, t('served_n', { n: gain }), 'good');
    if (patFrac > 0.66) UI.floater(c.x, c.y - 182, t('perfect'), 'perfect');
    if (!this.tutDone.purr && this.purr >= 35) { this.tutDone.purr = 1; UI.toast(t('purr_tip')); }
    c.state = 'leave'; c.happy = true; c.tx = -90;
    if (this.day === 1 && !this.tut.serve) { this.tut.serve = 1; UI.toast(t('toast_free')); }
    UI.syncHud(true);
  },

  /* ---------- update ---------- */
  update(dt) {
    if (this.state !== 'play') { this.idleUpdate(dt); return; }
    const b = this.barista;
    this.t += dt;
    const frac = this.t / this.cfg.duration;
    const wasRush = this.rush;
    this.rush = frac >= this.cfg.rushStart && frac < this.cfg.rushEnd;
    if (this.rush && !this.rushAnnounced) { this.rushAnnounced = true; UI.toast(t('rush') + '!'); Audio_.play('chime'); }
    const ph = frac < 0.6 ? 0 : (frac < this.cfg.nightFrac ? 1 : 2);
    if (ph !== this.phase) {
      this.phase = ph;
      if (ph === 2 && !this.night) { this.night = true; Audio_.night = true; UI.toast(t('toast_night')); }
      UI.setVignette(ph);
    }
    const f = clamp((frac - (ph === 1 ? 0.6 : this.cfg.nightFrac)) / 0.08, 0, 1);
    this.bg.day.setOpacity(ph === 0 ? 1 : (ph === 1 ? 1 - f : 0));
    this.bg.dusk.setOpacity(ph === 1 ? f : (ph === 2 ? 1 - f : 0));
    this.bg.night.setOpacity(ph === 2 ? f : 0);
    const glow = ph === 2 ? 0.85 : (ph === 1 ? 0.4 * f : 0);
    this.glowSpr.forEach((g, i) => g.setOpacity(glow * (0.9 + 0.1 * Math.sin(this.t * 3 + i * 2))));
    // spawn
    if (this.t < this.cfg.duration - 12) {
      this.spawnT -= dt;
      if (this.spawnT <= 0) { this.spawnCustomer(); const rushMult = this.rush ? 0.62 : 1; this.spawnT = this.cfg.spawnBase * rushMult * rnd(0.75, 1.25); }
    }
    // customers
    for (let i = this.customers.length - 1; i >= 0; i--) {
      const c = this.customers[i];
      c.bobT += dt;
      if (c.shakeT > 0) c.shakeT -= dt;
      const isGhost = !!CUST_TYPES[c.type].ghost;
      if (c.state === 'enter') {
        const sp = isGhost ? 90 : 170;
        const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
        if (d < 6) {
          c.x = c.tx; c.y = c.ty; c.state = 'wait'; this.makeBubble(c);
          if (this.day === 1 && !this.tut.cup && !this.tutDone.first) { this.tutDone.first = 1; UI.toast(t('toast_cup')); }
        } else { c.x += dx / d * sp * dt; c.y += dy / d * sp * dt; c.ft += dt; c.frame = Math.floor(c.ft / 0.22) % 2; }
        if (isGhost) { c.fade = Math.min(1, c.fade + dt * 1.5); c.spr.setOpacity(c.fade * 0.92); }
      } else if (c.state === 'wait') {
        c.frame = Math.floor(c.bobT / 2.4) % 2;
        c.pat -= dt;
        if (c.popT < 1) {
          c.popT = Math.min(1, c.popT + dt * 4);
          const s = easeOut(c.popT);
          c.bubble.setScale(s, s);
          c.icons.forEach(ic => ic.setOpacity(s));
          c.barBack.setOpacity(s); c.bar.setOpacity(s);
        }
        const pf = clamp(c.pat / c.patMax, 0, 1);
        c.bar.setScale(Math.max(0.02, pf), 1);
        const col = pf > 0.5 ? [lerp(0.95, 0.6, (pf - 0.5) * 2), lerp(0.72, 0.8, (pf - 0.5) * 2), 0.35] : [0.93, lerp(0.32, 0.72, pf * 2), 0.33];
        c.bar.setTint(col[0], col[1], col[2]);
        if (c.pat <= 0) {
          c.state = 'leave'; c.happy = false; c.tx = -90;
          this.lostDay++; this.streak = 0; this.strikes++;
          Audio_.play('angry');
          Scene.burst('angry', c.x, c.y - 110, 3, 50);
          UI.shake();
          UI.syncHud(true);
          if (c.bubble) { c.bubble.destroy(); c.icons.forEach(ic => ic.destroy()); c.barBack.destroy(); c.bar.destroy(); c.bubble = null; }
          if (this.strikes >= 3 && this.overT < 0) this.overT = 1.2;
        }
      } else if (c.state === 'leave') {
        if (isGhost) {
          c.fade -= dt * 1.2; c.spr.setOpacity(Math.max(0, c.fade) * 0.92);
          if (c.fade <= 0) { this.destroyCustomer(c); this.customers.splice(i, 1); continue; }
        } else {
          c.x -= 180 * dt; c.ft += dt; c.frame = Math.floor(c.ft / 0.2) % 2;
          if (c.x < -90) { this.destroyCustomer(c); this.customers.splice(i, 1); continue; }
        }
      }
      const walking = c.state !== 'wait';
      const bob = c.state === 'wait' ? Math.sin(c.bobT * 3) * 3 : Math.abs(Math.sin(c.ft * 9)) * 5;
      const shx = c.shakeT > 0 ? Math.sin(c.shakeT * 40) * 6 : 0;
      const hover = isGhost ? Math.sin(c.bobT * 2) * 7 : 0;
      c.spr.setPosCY(c.x + shx, c.y - 75 + bob * 0.4 - hover);
      if (c.state === 'wait' && this.trayMatches(c)) { const pu = 1 + Math.sin(c.bobT * 7) * 0.03; c.spr.setScale(pu, pu); }
      else c.spr.setScale(1, 1);
      if (c.state === 'wait' && c.bubble) {
        const urgency = clamp(1 - c.pat / c.patMax, 0, 1);
        const bp = urgency > 0.67 ? 1 + Math.sin(c.bobT * 10) * 0.045 : 1;
        c.bubble.setScale(bp, bp);
      }
      c.spr.setCanvas(ART.c['cust_' + c.type + '_' + c.frame]);
      if (c.bubble) {
        const by = c.y - 185 + bob * 0.5 - hover;
        c.bubble.setPosCY(c.x, by);
        c.icons.forEach((ic, idx) => ic.setPosCY(c.iconXs[idx], by - 6));
        const pf = clamp(c.pat / c.patMax, 0, 1);
        c.barBack.setPosCY(c.x, by + 20);
        c.bar.setPosCY(c.x - (1 - pf) * c.bar.w / 2, by + 20);
      }
    }
    // barista
    b.bobT += dt;
    if (!b.pending && b.queue.length) { b.pending = b.queue.shift(); b.actT = 0; }
    const targetX = b.pending ? (b.pending.type === 'station' ? STATIONS.find(s => s.id === b.pending.st).x : clamp(b.pending.cust.x, 170, 1210)) : b.tx;
    const dx = targetX - b.x;
    if (Math.abs(dx) > 4) {
      const moveSpeed = this.upgrades.fast ? 638 : 560;
      b.x += Math.sign(dx) * Math.min(Math.abs(dx), moveSpeed * dt);
    } else if (b.pending) {
      b.actT += dt;
      if (b.actT > 0.18) {
        const p = b.pending; b.pending = null; b.actT = 0;
        if (p.type === 'station') this.applyStation(p.st);
        else if (p.cust.state === 'wait') this.tryServe(p.cust);
      }
    }
    const byB = LY.barista + (Math.abs(dx) > 4 ? -Math.abs(Math.sin(b.bobT * 10)) * 4 : Math.sin(b.bobT * 2.2) * 2);
    b.spr.setPosCY(b.x, byB);
    b.spr.setCanvas(ART.c['barista_' + (b.mix.length || b.food ? 1 : 0)]);
    b.tray.setPosCY(b.x, byB + 6);
    b.tray.setOpacity(b.mix.length || b.food ? 1 : 0);
    if (this.day === 1 && !this.tut.cup) {
      const pu = 1 + Math.sin(this.t * 5) * 0.06;
      this.stationSpr.cups.setScale(pu, pu);
    } else this.stationSpr.cups.setScale(1, 1);
    // cats
    for (const k of this.cats) this.updateCat(k, dt, true);
    this.purr = Math.min(this.purrMax, this.purr + dt * 0.8);

    // day end
    if (this.t >= this.cfg.duration && this.endT < 0) this.endT = 8;
    if (this.endT > 0) {
      this.endT -= dt;
      const busy = this.customers.some(c => c.state === 'wait' || c.state === 'enter');
      if (!busy || this.endT <= 0) { this.endDay(); return; }
    }
    if (this.overT > 0) { this.overT -= dt; if (this.overT <= 0) { this.gameOver(); return; } }
    UI.syncHud(false);
  },

  updateCat(k, dt, live) {
    k.cd = Math.max(0, k.cd - dt);
    k.ft += dt;
    if (k.state === 'pet') {
      k.t -= dt; k.spr.setCanvas(ART.c['cat_' + k.style + '_1']);
      k.spr.setPosCY(k.x, k.y - Math.abs(Math.sin((1.1 - k.t) * 6)) * 10);
      if (k.t <= 0) { k.state = 'idle'; k.t = rnd(1, 3); }
      return;
    }
    if (k.state === 'sleep') {
      k.spr.setCanvas(ART.c['cat_' + k.style + '_2']);
      k.spr.setPosCY(k.x, k.y);
      if (live && Math.random() < dt * 0.5) Scene.spawnParticle('zzz', k.x + 20, k.y - 20, { vy: 40, vx: 14, life: 1.6, size: 30 });
      if (k.t <= 0 || Math.random() < dt * 0.1) { k.state = 'idle'; k.t = rnd(1, 3); }
      k.t -= dt;
      return;
    }
    k.t -= dt;
    if (k.t <= 0) {
      if (k.state === 'walk') { k.state = 'idle'; k.t = rnd(2, 5); }
      else {
        if (Math.random() < 0.22) { k.state = 'sleep'; k.t = rnd(6, 10); }
        else { k.state = 'walk'; k.tx = rnd(160, 1140); k.ty = rnd(640, 700); k.t = 99; }
      }
    }
    if (k.state === 'walk') {
      const ddx = k.tx - k.x, ddy = k.ty - k.y, d = Math.hypot(ddx, ddy);
      if (d < 5) { k.state = 'idle'; k.t = rnd(2, 4); }
      else { k.x += ddx / d * 60 * dt; k.y += ddy / d * 60 * dt; k.frame = Math.floor(k.ft / 0.25) % 2; }
    } else k.frame = Math.floor(k.ft / 1.4) % 2;
    k.spr.setCanvas(ART.c['cat_' + k.style + '_' + k.frame]);
    k.spr.setPosCY(k.x, k.y);
  },

  idleUpdate(dt) {
    for (const k of this.cats) this.updateCat(k, dt, true);
  },

  clockString() {
    const frac = clamp(this.t / this.cfg.duration, 0, 1);
    const hrs = 8 + 14 * frac;
    const h = Math.floor(hrs), m = Math.floor((hrs - h) * 60 / 5) * 5;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }
};

/* ============================================================
   PURR CAFE — DOM UI: menus, HUD, toasts, results, recipe book
   ============================================================ */
'use strict';

const UI = {
  scr: {}, lastHud: {}, toastQ: [], toastEl: null, toastT: 0,

  init() {
    ['menu', 'how', 'set', 'pause', 'results', 'upgrade', 'gameover', 'about'].forEach(s => this.scr[s] = $('#screen-' + s));
    this.hud = $('#hud');
    this.bind('btn-start', () => { Audio_.play('click'); Game.newRun(); this.hideAll(); });
    this.bind('btn-continue', () => { Audio_.play('click'); Game.continueRun(); this.hideAll(); });
    this.bind('btn-how', () => { Audio_.play('click'); this.show('how'); this.renderBook(); });
    this.bind('btn-set', () => { Audio_.play('click'); this.show('set'); });
    this.bind('btn-about', () => { Audio_.play('click'); this.show('about'); });
    this.bind('btn-how-back', () => { Audio_.play('click'); this.show('menu'); });
    this.bind('btn-about-back', () => { Audio_.play('click'); this.show('menu'); });
    this.bind('btn-set-back', () => { Audio_.play('click'); this.show(Game.state === 'play' || Game.state === 'pause' ? 'pause' : 'menu'); });
    this.bind('btn-pause-how', () => { Audio_.play('click'); this.show('how'); });
    this.bind('btn-resume', () => { Audio_.play('click'); this.setPause(false); });
    this.bind('btn-pause-set', () => { Audio_.play('click'); this.show('set'); });
    this.bind('btn-restart', () => { Audio_.play('click'); Game.newRun(); this.hideAll(); });
    this.bind('btn-pause-menu', () => { Audio_.play('click'); Game.state = 'menu'; Store.data.run = Store.data.run; Store.save(); this.show('menu'); this.refreshMenu(); });
    this.bind('btn-next', () => { Audio_.play('click'); this.showUpgrades(); });
    this.bind('btn-skip-upgrade', () => { Audio_.play('click'); Game.startDay(Game.day + 1); this.hideAll(); });
    this.bind('btn-go-retry', () => { Audio_.play('click'); Game.newRun(); this.hideAll(); });
    this.bind('btn-go-menu', () => { Audio_.play('click'); Game.state = 'menu'; Audio_.night = false; Audio_.startMusic(); this.show('menu'); this.refreshMenu(); });
    this.bind('btn-full', () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); });
    // settings
    const mv = $('#set-music'), sv = $('#set-sfx');
    mv.value = Store.data.music * 100; sv.value = Store.data.sfx * 100;
    mv.addEventListener('input', () => Audio_.setMusic(mv.value / 100));
    sv.addEventListener('input', () => Audio_.setSfx(sv.value / 100));
    $('#set-lang').value = LANG;
    $('#set-lang').addEventListener('change', e => { LANG = e.target.value; Store.data.lang = LANG; Store.save(); this.applyLang(); this.renderBook(); });
    // pause key
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (Game.state === 'play') this.setPause(true);
        else if (Game.state === 'pause') this.setPause(false);
        else if (!this.scr.how.classList.contains('hidden') || !this.scr.set.classList.contains('hidden') || !this.scr.about.classList.contains('hidden')) this.show(Game.state === 'pause' ? 'pause' : 'menu');
        else if (!this.scr.upgrade.classList.contains('hidden')) this.show('results');
      }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && Game.state === 'play') this.setPause(true); });
    this.applyLang();
    this.show('menu');
    this.refreshMenu();
  },

  bind(id, cb) { const e = $('#' + id); if (e) e.addEventListener('click', cb); },

  show(name) { Object.values(this.scr).forEach(s => s.classList.add('hidden')); if (name && this.scr[name]) this.scr[name].classList.remove('hidden'); this.hud.classList.toggle('hidden', !(Game.state === 'play' || Game.state === 'pause')); },
  hideAll() { this.show(null); this.hud.classList.remove('hidden'); },

  setPause(on) {
    if (on && Game.state === 'play') { Game.state = 'pause'; this.show('pause'); }
    else if (!on && Game.state === 'pause') { Game.state = 'play'; this.hideAll(); }
  },

  refreshMenu() {
    const r = Store.data.run;
    const bc = $('#btn-continue');
    if (r && r.day > 1) { bc.style.display = ''; bc.textContent = t('btn_continue', { d: r.day }); }
    else if (r && r.day === 1 && Game.servedDay === 0 && Game.t === 0) { bc.style.display = ''; bc.textContent = t('btn_continue', { d: 1 }); }
    else bc.style.display = 'none';
    const b = Store.data.best;
    $('#menu-stats').innerHTML = b.day > 0 ? `★ ${t('go_best', { d: b.day })} · ${t('go_tips', { n: b.tips })}` : '';
  },

  applyLang() {
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach(e => { e.innerHTML = t(e.dataset.i18n); });
    document.title = LANG === 'ru' ? 'Мур-кафе: один обычный день' : 'Purr Cafe: An Average Day';
    this.refreshMenu();
    this.syncHud(true);
  },

  /* ---------- HUD ---------- */
  syncHud(force) {
    if (Game.state !== 'play' && Game.state !== 'pause') return;
    const h = this.lastHud;
    const clock = Game.clockString();
    if (force || h.clock !== clock) { $('#hud-clock').textContent = clock; h.clock = clock; }
    if (force || h.day !== Game.day) { $('#hud-day').textContent = t('hud_day', { d: Game.day }); h.day = Game.day; }
    if (force || h.coins !== Game.coins) { $('#hud-coins').textContent = Game.coins; h.coins = Game.coins; }
    if (force || h.strikes !== Game.strikes) {
      const hs = $('#hud-hearts').children;
      for (let i = 0; i < 3; i++) hs[i].classList.toggle('off', i < Game.strikes);
      h.strikes = Game.strikes;
    }
    const st = Game.streak >= 2 ? t('combo', { n: Game.streak }) : '';
    if (force || h.streak !== st) { $('#hud-streak').textContent = st; h.streak = st; }
    const purrText = t('purr_hud', { n: Math.round(Game.purr / Math.max(1, Game.purrMax) * 100) });
    if (force || h.purr !== purrText) { $('#hud-purr').textContent = purrText; h.purr = purrText; }
    $('#hud-rush').classList.toggle('hidden', !Game.rush);
    const served = Game.servedDay, lost = Game.lostDay;
    if (force || h.served !== served) { $('#hud-served').textContent = served; h.served = served; }
    if (force || h.lost !== lost) { $('#hud-lost').textContent = lost; h.lost = lost; }
  },

  setVignette(ph) {
    const v = $('#vignette');
    v.style.background = ph === 0 ? 'rgba(255,190,120,0)' : (ph === 1 ? 'rgba(255,140,80,.12)' : 'rgba(38,36,88,.30)');
  },

  shake() {
    const s = $('#stage');
    s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
  },

  /* ---------- toasts & floaters ---------- */
  toast(text) {
    this.toastQ.push(text);
    if (!this.toastEl) this.nextToast();
  },
  nextToast() {
    const box = $('#toasts');
    if (!this.toastQ.length) { this.toastEl = null; return; }
    const text = this.toastQ.shift();
    const e = el('div', 'toast', text);
    box.appendChild(e);
    this.toastEl = e;
    setTimeout(() => { e.classList.add('out'); setTimeout(() => { e.remove(); this.nextToast(); }, 400); }, 3600);
  },
  floater(wx, wy, text, cls) {
    const p = Scene.screenFromWorld(wx, 720 - wy);
    const e = el('div', 'floater ' + (cls || ''), text);
    e.style.left = p.x + 'px'; e.style.top = p.y + 'px';
    $('#floaters').appendChild(e);
    setTimeout(() => e.remove(), 1300);
  },

  /* ---------- screens ---------- */
  showDayIntro(n, unlocks) {
    const d = $('#dayintro');
    d.innerHTML = `<div class="di-title">${t('newday', { d: n })}</div>` +
      (unlocks.length ? `<div class="di-unlock">${t('unlock', { what: unlocks.join(', ') })}</div>` : '');
    d.classList.remove('show'); void d.offsetWidth; d.classList.add('show');
    if (n >= FOOD.day && unlocks.includes(t('st_pastry')) && !Game.tutDone.food) { Game.tutDone.food = 1; setTimeout(() => this.toast(t('toast_food')), 2600); }
  },

  showUpgrades() {
    const box = $('#upgrade-cards');
    const coinBox = $('#upgrade-coins');
    if (!box) return;
    coinBox.textContent = '● ' + Game.coins;
    const available = UPGRADES.filter(u => !Game.upgrades[u.id]);
    const shuffled = available.slice().sort(() => Math.random() - 0.5);
    const choices = shuffled.slice(0, Math.min(3, shuffled.length));
    Game.pendingUpgradeChoices = choices;
    box.innerHTML = '';
    for (const u of choices) {
      const card = el('div', 'upgrade-card' + (Game.coins < u.cost ? ' disabled' : ''));
      card.innerHTML = `<div class="upgrade-icon">${u.icon}</div><div class="upgrade-name">${t(u.name)}</div><div class="upgrade-desc">${t(u.desc)}</div><div class="upgrade-cost">${t('upgrade_cost',{n:u.cost})}</div>`;
      if (Game.coins >= u.cost) card.addEventListener('click', () => {
        Game.coins -= u.cost; Game.upgrades[u.id] = true;
        Store.data.run = { day: Game.day + 1, coins: Game.coins, upgrades: Game.upgrades }; Store.save();
        Audio_.play('star');
        UI.toast(t('upgrade_bought',{what:t(u.name)}));
        Game.startDay(Game.day + 1); this.hideAll();
      });
      box.appendChild(card);
    }
    if (!choices.length) { box.innerHTML = `<div style="grid-column:1/-1;padding:18px;color:#8a6a4f">${LANG === 'ru' ? 'Все улучшения уже установлены. Кафе готово к следующей смене!' : 'All improvements are installed. The cafe is ready for the next shift!'}</div>`; }
    this.show('upgrade');
    this.hud.classList.add('hidden');
  },

  showResults() {
    const stars = Game.lostDay === 0 ? 3 : (Game.lostDay === 1 ? 2 : 1);
    $('#res-title').textContent = t('res_title', { d: Game.day });
    $('#res-stars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    $('#res-served').textContent = Game.servedDay;
    $('#res-lost').textContent = Game.lostDay;
    $('#res-coins').textContent = Game.coinsDay;
    const bn = $('#res-bonus');
    if (bn) { bn.style.display = Game.lostDay === 0 ? '' : 'none'; if (Game.lostDay === 0) bn.textContent = t('res_bonus', { n: 50 }); }
    $('#res-best').textContent = Game.bestStreak;
    this.show('results');
    this.hud.classList.add('hidden');
  },

  showGameOver() {
    const b = Store.data.best;
    $('#go-days').textContent = t('go_days', { d: Game.day });
    $('#go-served').textContent = t('go_served', { n: b.served });
    $('#go-best').textContent = t('go_best', { d: b.day });
    $('#go-tips').textContent = t('go_tips', { n: b.tips });
    this.show('gameover');
    this.hud.classList.add('hidden');
  },

  /* ---------- recipe book ---------- */
  renderBook() {
    const box = $('#recbook'); if (!box) return;
    box.innerHTML = '';
    const row = (nameCanvas, label, price, locked) => {
      const r = el('div', 'rec' + (locked ? ' locked' : ''));
      const img = el('img'); img.src = nameCanvas.toDataURL();
      r.appendChild(img);
      r.appendChild(el('span', 'rec-name', label));
      r.appendChild(el('span', 'rec-price', locked ? t('hud_day', { d: locked }) : ('● ' + price)));
      box.appendChild(r);
    };
    for (const rec of RECIPES) {
      const wrap = cv(34 * rec.steps.length + 8, 40); const g = cx(wrap);
      rec.steps.forEach((s, i) => g.drawImage(ART.c['icon_' + s], 4 + i * 34, 0, 34, 34));
      const locked = rec.day > Game.day ? rec.day : 0;
      row(wrap, t('r_' + rec.id) + (rec.night ? ' ☾' : ''), rec.price, locked);
    }
    if (Game.day >= FOOD.day || true) {
      const locked = FOOD.day > Game.day ? FOOD.day : 0;
      row(ART.c.icon_cookie, t('r_cookie'), FOOD.price, locked);
    }
  }
};

/* ============================================================
   PURR CAFE — boot
   ============================================================ */
(async function () {
  Store.load();
  const failBox = $('#loadfail');
  if (typeof pc === 'undefined') { failBox.classList.remove('hidden'); return; }
  buildArt();
  try {
    await Scene.init($('#game'));
  } catch (e) {
    console.error(e);
    failBox.classList.remove('hidden');
    return;
  }
  Game.buildScene();
  UI.init();
  // Reveal the menu only after PlayCanvas + UI are fully initialized.
  $('#stage').classList.remove('booting');
  Scene.updateCbs.push(dt => Game.update(dt));
  Game.state = 'menu';
  UI.setVignette(0);
  // audio needs a user gesture
  const kick = () => {
    Audio_.init(); Audio_.resume(); Audio_.startMusic();
    window.removeEventListener('pointerdown', kick);
    window.removeEventListener('keydown', kick);
  };
  window.addEventListener('pointerdown', kick);
  window.addEventListener('keydown', kick);
})();

</script>
</body>
</html>
